[project]
name = "talkback-engine"
version = "0.4.9"
description = "Kokoro-82M text-to-speech daemon for the talkback Claude Code plugin"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy",
    "soundfile>=0.13",
    # Apple silicon: Kokoro on the GPU through MLX.
    "mlx-audio>=0.6.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "misaki>=0.9.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "num2words; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "phonemizer-fork; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "espeakng-loader; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "spacy>=3.8,<3.9; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "en-core-web-sm; sys_platform == 'darwin' and platform_machine == 'arm64'",
    # Everything else (Linux, Windows, Intel Macs): Kokoro ONNX on the CPU.
    "kokoro-onnx>=0.4.9; sys_platform != 'darwin' or platform_machine != 'arm64'",
]

[tool.uv]
package = false
# onnxruntime 1.31 has no macOS x86_64 wheel; 1.23 is the last line that does.
constraint-dependencies = ["onnxruntime<1.24; sys_platform == 'darwin' and platform_machine == 'x86_64'"]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
