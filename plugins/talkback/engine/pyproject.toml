[project]
name = "talkback-engine"
version = "0.1.0"
description = "Kokoro-82M text-to-speech daemon for the talkback Claude Code plugin"
requires-python = ">=3.11,<3.14"
dependencies = [
    "mlx-audio>=0.6.4",
    "misaki>=0.9.4",
    "num2words",
    "phonemizer-fork",
    "espeakng-loader",
    "spacy>=3.8,<3.9",
    "en-core-web-sm",
    "soundfile>=0.13",
]

[tool.uv]
package = false

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
